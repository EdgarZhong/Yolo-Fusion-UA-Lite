nc: 5
ch: 3

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # 标准 YOLOv8n 单主干前段
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4：原始 P3 特征
  # 公平对照：把双模态 FA-Concat 的单路半模块迁移到单模态 P3 支路
  - [-1, 1, SingleModalInceptionSE, []]  # 5：增强后的 P3 特征
  - [-1, 1, Conv, [512, 3, 2]]     # 6-P4/16
  - [-1, 6, C2f, [512, True]]      # 7
  - [-1, 1, Conv, [1024, 3, 2]]    # 8-P5/32
  - [-1, 3, C2f, [1024, True]]     # 9
  - [-1, 1, SPPF, [1024, 5]]       # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]      # 12：与 P4 侧路拼接
  - [-1, 3, C2f, [512]]            # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]      # 15：与增强后的 P3 侧路拼接
  - [-1, 3, C2f, [256]]            # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]     # 18：回流到 P4
  - [-1, 3, C2f, [512]]            # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]     # 21：回流到 P5
  - [-1, 3, C2f, [1024]]           # 22 (P5/32-large)

  - [[16, 19, 22], 1, OBB, [nc, 1]]
