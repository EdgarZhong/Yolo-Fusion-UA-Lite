# 双主干改进融合 OBB 模型配置（CM‑FA‑Concat + FPN/PAN Neck 完整体）
# 说明：
# - 本配置基于 `dualbackbone_CM-FA-Concat.yaml`，在三尺度融合（P3/P4/P5：CrossModalFusionAttention + C2f）之后，
#   按照 YOLOv8 标准架构补全 FPN（自顶向下）与 PANet（自底向上）颈部结构，最终再接三尺度 OBB 检测头。
# - 设计目标：打通尺度间的特征交互，增强小目标与定位能力，同时保持与原 CM‑FA‑Concat 输出通道一致（P3=256, P4=512, P5=1024），
#   以便与既有 OBB 头无缝对接。

# 类别数（与数据集一致）
nc: 5

# 输入通道固定为 6（RGB+IR）
ch: 6

# 复用官方的尺度表（depth, width, max_channels）以兼容不同模型规模的自动缩放
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# 双主干（Backbone）：与 FA‑Concat 保持一致（前端切分两模态，各自独立主干提取 P3/P4/P5）
backbone:
  # 0: 恒等输入，占位并明确分支起点（供两路 ModalitySelector 复用）
  - [-1, 1, IdentityInput, []]
  # 1: 从恒等输入选择 RGB（三通道）
  - [-1, 1, ModalitySelector, [1]]
  # 2: 从恒等输入选择 IR（三通道）
  #    注意：此处使用 -2 以确保选择同一上游输入（而非上一层的输出），配合解析器的负索引行为达到复用输入的效果。
  - [-2, 1, ModalitySelector, [2]]

  # ===== RGB 分支（从 1 开始） =====
  - [1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]  # RGB-P3（通道 256）
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]  # RGB-P4（通道 512）
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]    # RGB-P5（通道 1024）

  # ===== IR 分支（从 2 开始） =====
  - [2, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]  # IR-P3（通道 256）
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]  # IR-P4（通道 512）
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]    # IR-P5（通道 1024）

# 颈部与头部（Head）：各尺度 CM‑FA‑Concat 融合 + C2f 规整，插入 FPN + PANet 后接三尺度 OBB 检测头
# 索引说明：截至上方主干，层索引依次为 0..22，其中：
# - RGB-P3: 7，RGB-P4: 9，RGB-P5: 12
# - IR-P3: 17，IR-P4: 19，IR-P5: 22
# 在此基础上，先进行三尺度 CM‑FA‑Concat 融合并各自 C2f 规整得到 fused 特征：
# - fused_P3 → layer 24（通道 256）
# - fused_P4 → layer 26（通道 512）
# - fused_P5 → layer 28（通道 1024）
# 然后插入标准 FPN（自顶向下）与 PANet（自底向上），最终将 Neck 输出接入 OBB 头。
head:
  # ===== 三尺度融合（FA‑Concat 替换纯 Concat） =====
  # P3 融合：输入为 RGB-P3(7) 与 IR-P3(17)，输出沿通道维拼接，经 C2f 规整为 256 通道
  - [[7, 17], 1, CrossModalFusionAttention, []]
  - [-1, 3, C2f, [256]]       # 24: fused_P3（Neck 入口之一）

  # P4 融合：输入为 RGB-P4(9) 与 IR-P4(19)，规整后 512 通道
  - [[9, 19], 1, CrossModalFusionAttention, []]
  - [-1, 3, C2f, [512]]       # 26: fused_P4（Neck 入口之二）

  # P5 融合：输入为 RGB-P5(12) 与 IR-P5(22)，规整后 1024 通道
  - [[12, 22], 1, CrossModalFusionAttention, []]
  - [-1, 3, C2f, [1024]]      # 28: fused_P5（Neck 入口之三）

  # ===== FPN（自顶向下）：将高层语义下传 =====
  # 29: 上采样 fused_P5（当前 -1 指向 28），尺寸 ×2，通道保持 1024
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  # 30: 拼接（上采样的 P5 与 fused_P4[26]），通道为 1024+512=1536
  - [[-1, 26], 1, Concat, [1]]
  # 31: C2f 规整得到 Neck_P4，通道回落至 512，语义信息增强
  - [-1, 3, C2f, [512]]
  # 32: 上采样 Neck_P4，尺寸 ×2，通道保持 512
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  # 33: 拼接（上采样的 P4 与 fused_P3[24]），通道为 512+256=768
  - [[-1, 24], 1, Concat, [1]]
  # 34: C2f 规整得到 Neck_P3（小目标特征极大增强），通道回落至 256
  - [-1, 3, C2f, [256]]

  # ===== PANet（自底向上）：将低层定位回传 =====
  # 35: 下采样 Neck_P3（stride=2），保持 256 通道
  - [-1, 1, Conv, [256, 3, 2]]
  # 36: 拼接（下采样的 P3 与 Neck_P4[31]），通道为 256+512=768
  - [[-1, 31], 1, Concat, [1]]
  # 37: C2f 规整得到 Final_P4，通道回落至 512
  - [-1, 3, C2f, [512]]
  # 38: 下采样 Final_P4（stride=2），保持 512 通道
  - [-1, 1, Conv, [512, 3, 2]]
  # 39: 拼接（下采样的 P4 与 fused_P5[28]），通道为 512+1024=1536
  - [[-1, 28], 1, Concat, [1]]
  # 40: C2f 规整得到 Final_P5，通道回落至 1024
  - [-1, 3, C2f, [1024]]

  # ===== 三尺度 OBB 检测头：改为接 Neck 输出 =====
  # 输入为 Neck_P3(34)、Final_P4(37)、Final_P5(40)，与原 fused 三尺度通道一致
  - [[34, 37, 40], 1, OBB, [nc, 1]]

