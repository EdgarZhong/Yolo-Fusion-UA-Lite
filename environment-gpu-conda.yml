# 跨设备 GPU 环境（Conda 方案）：使用 conda 提供的 CUDA 运行库，适合不同机器快速复现
# 用法：
#   conda env create -n yolo-fusion-lite -f environment-gpu-conda.yml
#   conda activate yolo-fusion-lite
# 验证：
#   python -c "import torch; print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"

name: yolo-fusion-lite
channels:
  - defaults
  - pytorch
  - nvidia
dependencies:
  - python=3.13
  - pytorch=2.6
  - torchvision=0.21
  - pytorch-cuda=12.4
  - numpy=2.2.6
  - pip
  - pip:
      - ultralytics==8.3.228
      - opencv-python==4.12.0.88